openapi: 3.0.3
info:
  title: Фотопринт Контур — API платформы «Пульс»
  version: 0.9.0
  description: |
    Единый REST-контракт платформы. Потребители: web-панель (трек 1),
    мобильное приложение picPac (трек 2), AI-ассистент «Проявитель» (трек 3).

    Соглашения:
    - Все времена — ISO 8601 UTC, отображение в Europe/Minsk (UTC+3).
    - Деньги — BYN; финансовые демо-значения могут быть в условных единицах (units).
    - Ошибки — RFC 7807 (application/problem+json): { title, status, detail, traceId }.
    - Права проверяются на сервере; доступ мимо scope → 403 + запись в аудит.
    - Идемпотентность: POST-запросы с Idempotency-Key при повторе возвращают
      исходный результат без побочных эффектов.
    - Живые обновления: SignalR-хаб /hubs/pulse (события metric.updated,
      order.created, order.status_changed, decision.due, sla.at_risk, kpi.red).
servers:
  - url: http://localhost:8080
    description: Локальная разработка
security:
  - bearerAuth: []

tags:
  - { name: Auth,        description: Аутентификация и профиль }
  - { name: Metrics,     description: Пульс компании, KPI, drill-down, прогноз }
  - { name: Decisions,   description: Реестр решений и проверка эффекта }
  - { name: Sales,       description: Клиенты и воронка }
  - { name: Support,     description: Инбокс поддержки и SLA }
  - { name: Production,  description: Производство, качество, канбан }
  - { name: Moderation,  description: Очередь модерации проектов picPac }
  - { name: Tasks,       description: Задачник }
  - { name: Marketing,   description: Кампании }
  - { name: Equipment,   description: Станки и материалы }
  - { name: Hr,          description: TeamBoard: люди, нагрузка, отсутствие }
  - { name: Recruiting,  description: Рекрутинг-воронка }
  - { name: Finance,     description: P&L: план/факт и маржа }
  - { name: Kb,          description: База знаний }
  - { name: Approvals,   description: Согласования }
  - { name: DataQuality, description: Качество данных и DataFactory }
  - { name: Catalog,     description: Каталог picPac (трек 2) }
  - { name: Orders,      description: Заказы и статусы (трек 2) }
  - { name: Assistant,   description: AI-ассистент (трек 3) }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход (логин+пароль, выдача JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, example: director }
                password: { type: string, example: demo1234 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAtUtc: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
  /me:
    get:
      tags: [Auth]
      summary: Текущий профиль (роль, пермишены, department_scope)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  # ---------------- Metrics ----------------
  /metrics/pulse:
    get:
      tags: [Metrics]
      summary: Пульс компании — все KPI с планом/фактом/прогнозом и статусом
      parameters:
        - { name: from,        in: query, schema: { type: string, format: date } }
        - { name: to,          in: query, schema: { type: string, format: date } }
        - { name: department,  in: query, schema: { type: string }, description: id подразделения; пусто = доступный scope }
        - { name: product,     in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
                  filters: { type: object }
                  kpis:
                    type: array
                    items: { $ref: "#/components/schemas/KpiStatus" }
                  criticalAlerts:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
  /metrics/{code}:
    get:
      tags: [Metrics]
      summary: Стеклянная метрика — паспорт KPI (формула, источник, время обновления)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: defect_rate }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricDefinition" }
  /metrics/{code}/breakdown:
    get:
      tags: [Metrics]
      summary: Drill-down метрики по измерению (до причины)
      parameters:
        - { name: code,  in: path, required: true, schema: { type: string } }
        - { name: by,    in: query, required: true, schema: { $ref: "#/components/schemas/BreakdownDimension" } }
        - { name: from,  in: query, schema: { type: string, format: date } }
        - { name: to,    in: query, schema: { type: string, format: date } }
        - { name: department, in: query, schema: { type: string } }
        - { name: product,    in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, description: напр. "Станок №3" или "2026-W45" }
                        value: { type: number }
                        plan: { type: number }
                        status: { $ref: "#/components/schemas/TrafficLight" }
                        drillTo: { type: string, description: ссылка/тип сущности для следующего уровня }
  /forecast/demand-vs-capacity:
    get:
      tags: [Metrics]
      summary: Прогноз спроса и мощности на 4+ недели с неделей дефицита
      parameters:
        - { name: weeks,       in: query, schema: { type: integer, default: 4 } }
        - { name: department,  in: query, schema: { type: string } }
        - { name: whatIfDemandDelta, in: query, schema: { type: number, description: "Что-если: сдвиг спроса, напр. 0.15 = +15%" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/ForecastPoint" }
                  deficitWeeks:
                    type: array
                    items: { type: string, format: date }
                  method: { type: string, description: "сезонность + тренд + скользящее среднее" }

  # ---------------- Decisions ----------------
  /decisions:
    get:
      tags: [Decisions]
      summary: Реестр решений (фильтры)
      parameters:
        - { name: status,     in: query, schema: { $ref: "#/components/schemas/DecisionStatus" } }
        - { name: priority,   in: query, schema: { type: integer } }
        - { name: department, in: query, schema: { type: string } }
        - { name: ownerId,    in: query, schema: { type: string } }
        - { name: overdue,    in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionList" }
    post:
      tags: [Decisions]
      summary: Создать карточку решения (в т.ч. из красного KPI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionCreate" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
  /decisions/{id}:
    patch:
      tags: [Decisions]
      summary: Изменить решение (каждое изменение — в журнал)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
  /decisions/{id}/verify:
    post:
      tags: [Decisions]
      summary: Повторная проверка — сравнение KPI до/после дедлайна
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionVerifyResult" }
  /decisions/{id}/history:
    get:
      tags: [Decisions]
      summary: История изменений решения (аудит)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  # ---------------- Sales ----------------
  /sales/funnel:
    get:
      tags: [Sales]
      summary: Воронка продаж по каналам
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to,   in: query, schema: { type: string, format: date } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        stage: { type: string, example: lead }
                        count: { type: integer }
                        conversionToNext: { type: number }
  /sales/channels: 
    get:
      tags: [Sales]
      summary: Каналы: лиды, заказы, средний чек
      responses:
        "200": { description: OK }
  /customers/{id}:
    get:
      tags: [Sales]
      summary: Карточка клиента с историей заказов и обращений
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: "#/components/schemas/Customer" }
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  interactions:
                    type: array
                    items: { $ref: "#/components/schemas/Interaction" }

  # ---------------- Support ----------------
  /support/inbox:
    get:
      tags: [Support]
      summary: Инбокс обращений (очередь с приоритизацией по SLA-риску)
      parameters:
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: topic,   in: query, schema: { $ref: "#/components/schemas/SupportTopic" } }
        - { name: assigneeId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interaction" }
  /support/tickets/{id}:
    get:
      tags: [Support]
      summary: Обращение с перепиской и контекстом клиента
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /support/tickets/{id}/reply:
    post:
      tags: [Support]
      summary: Ответ (текст или отправка черновика ассистента)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                assistantDraftId: { type: string }
      responses:
        "200": { description: OK }
  /support/tickets/{id}/resolve:
    post:
      tags: [Support]
      summary: Закрыть обращение (с причиной/результатом)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution: { type: string }
                inSla: { type: boolean }
      responses:
        "200": { description: OK }
  /support/sla:
    get:
      tags: [Support]
      summary: SLA-панель по темам и каналам
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  byTopic:
                    type: array
                    items:
                      type: object
                      properties:
                        topic: { $ref: "#/components/schemas/SupportTopic" }
                        slaPercent: { type: number }
                        avgFirstReplyMin: { type: number }
                        status: { $ref: "#/components/schemas/TrafficLight" }

  # ---------------- Production ----------------
  /production/queue:
    get:
      tags: [Production]
      summary: Очередь производства (этапы, возраст, станки)
      responses:
        "200": { description: OK }
  /production/load:
    get:
      tags: [Production]
      summary: Загрузка линий/станков по сменам
      responses:
        "200": { description: OK }
  /production/orders/{orderId}/advance:
    post:
      tags: [Production]
      summary: Перевести заказ на следующий этап (оператор линии)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                toStatus: { $ref: "#/components/schemas/OrderStatus" }
                stationId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEvent" }
  /production/defects:
    post:
      tags: [Production]
      summary: Зарегистрировать брак (станция, смена, причина)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Defect" }
      responses:
        "201": { description: Создано }
    get:
      tags: [Production]
      summary: Брак: по причинам/станкам/сменам за период
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to,   in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK }

  # ---------------- Moderation ----------------
  /moderation/queue:
    get:
      tags: [Moderation]
      summary: Очередь модерации проектов picPac (превью + возраст)
      responses:
        "200": { description: OK }
  /moderation/{orderId}/verdict:
    post:
      tags: [Moderation]
      summary: Вердикт по проекту (принять/отклонить с причиной)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict: { type: string, enum: [approved, rejected] }
                reason: { $ref: "#/components/schemas/RejectReason" }
                comment: { type: string }
      responses:
        "200": { description: OK }

  # ---------------- Tasks ----------------
  /tasks:
    get:
      tags: [Tasks]
      summary: Задачи (свои/по фильтру, с источником)
      parameters:
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: source,     in: query, schema: { $ref: "#/components/schemas/TaskSource" } }
        - { name: overdue,    in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      tags: [Tasks]
      summary: Создать задачу (в т.ч. ассистентом — через proposal)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Task" }
      responses:
        "201": { description: Создано }
  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Изменить задачу (статус, срок)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  # ---------------- Marketing ----------------
  /marketing/campaigns:
    get:
      tags: [Marketing]
      summary: Кампании (статус, канал, бюджет, окно)
      responses:
        "200": { description: OK }
    post:
      tags: [Marketing]
      summary: Запустить кампанию (напр. из сезонного прогноза)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                channel: { $ref: "#/components/schemas/Channel" }
                budget: { type: number }
                windowFrom: { type: string, format: date }
                windowTo: { type: string, format: date }
      responses:
        "201": { description: Создано }

  # ---------------- Equipment & Materials ----------------
  /equipment/stations:
    get:
      tags: [Equipment]
      summary: Станки: состояние, загрузка, брак, ТО
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }
  /equipment/{id}/maintenance:
    post:
      tags: [Equipment]
      summary: Запланировать/провести ТО станка
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /materials/stock:
    get:
      tags: [Equipment]
      summary: Остатки материалов с порогами заказа
      responses:
        "200": { description: OK }
  /materials/order:
    post:
      tags: [Equipment]
      summary: Заказать материалы (из порога или решения)
      responses:
        "201": { description: Создано }

  # ---------------- HR ----------------
  /hr/headcount:
    get:
      tags: [Hr]
      summary: Штат vs план по отделам (обеспеченность)
      responses:
        "200": { description: OK }
  /hr/load:
    get:
      tags: [Hr]
      summary: Нагрузка сотрудников (heat-map по неделям)
      responses:
        "200": { description: OK }
  /hr/absence:
    get:
      tags: [Hr]
      summary: Отсутствия (вход прогноза мощности)
      responses:
        "200": { description: OK }
  /hr/employees/{id}:
    get:
      tags: [Hr]
      summary: Карточка сотрудника (KPI, review, нагрузка; обезличено по роли)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  # ---------------- Recruiting ----------------
  /recruiting/vacancies:
    get:
      tags: [Recruiting]
      summary: Вакансии со прогнозом закрытия (из конверсии воронки)
      responses:
        "200": { description: OK }
  /recruiting/board:
    get:
      tags: [Recruiting]
      summary: Канбан кандидатов по этапам
      responses:
        "200": { description: OK }
  /recruiting/candidates/{id}/advance:
    post:
      tags: [Recruiting]
      summary: Перевести кандидата на следующий этап
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  # ---------------- Finance ----------------
  /finance/budget:
    get:
      tags: [Finance]
      summary: БДР/БДДС план-факт по статьям и отделам
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to,   in: query, schema: { type: string, format: date } }
        - { name: department, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
  /finance/unit-economics:
    get:
      tags: [Finance]
      summary: Маржинальность по продуктам/клиентам/каналам
      parameters:
        - { name: by, in: query, required: true, schema: { type: string, enum: [product, customer, channel] } }
      responses:
        "200": { description: OK }
  /finance/reconciliation:
    get:
      tags: [Finance]
      summary: Сверка финансовых итогов (для экрана качества данных)
      responses:
        "200": { description: OK }

  # ---------------- Knowledge Base ----------------
  /kb/search:
    get:
      tags: [Kb]
      summary: Поиск по базе знаний (учитывает ACL текущего пользователя)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: ai, in: query, schema: { type: boolean, default: false }, description: AI-режим с цитатами }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    document: { $ref: "#/components/schemas/Document" }
                    fragment: { type: string }
                    score: { type: number }
  /kb/articles/{id}:
    get:
      tags: [Kb]
      summary: Статья целиком (версия, дата актуальности)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }

  # ---------------- Approvals ----------------
  /approvals:
    get:
      tags: [Approvals]
      summary: Согласования (входящие/исходящие)
      parameters:
        - { name: inbox, in: query, schema: { type: boolean } }
      responses:
        "200": { description: OK }
    post:
      tags: [Approvals]
      summary: Создать заявку (отпуск, закупка, смена, спец-цена)
      requestBody:
        content:
          application/json:
            schema: { type: object, description: "шаблон из Inquiries/Templates" }
      responses:
        "201": { description: Создано }
  /approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Согласовать/отклонить шаг
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  # ---------------- DataQuality & DataFactory ----------------
  /data-quality:
    get:
      tags: [DataQuality]
      summary: Свежесть источников, пропуски/дубли, сверка итогов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: CRM }
                        lastSyncAtUtc: { type: string, format: date-time }
                        freshnessStatus: { $ref: "#/components/schemas/TrafficLight" }
                        issues:
                          type: array
                          items: { type: string }
                  reconciliation: { type: object }
  /datafactory/seed:
    post:
      tags: [DataQuality]
      summary: Перезагрузить синтетический датасет (воспроизводимость)
      responses:
        "200": { description: OK }
  /datafactory/timelapse:
    post:
      tags: [DataQuality]
      summary: Запустить time-lapse «один день фабрики» (ускоренные события в SignalR)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                speed: { type: integer, example: 3600, description: "во сколько раз ускорить" }
      responses:
        "200": { description: OK }

  # ---------------- Catalog (трек 2) ----------------
  /catalog/products:
    get:
      tags: [Catalog]
      summary: Каталог picPac: продукты, варианты, цены, требования к фото
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Карточка продукта
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  # ---------------- Orders (трек 2) ----------------
  /orders:
    post:
      tags: [Orders]
      summary: Создать заказ (идемпотентно по Idempotency-Key, МП-05)
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items]
              properties:
                customerId: { type: string }
                channel: { $ref: "#/components/schemas/Channel" }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      variantId: { type: string }
                      quantity: { type: integer }
                      projectRef: { type: string, description: ссылка на проект с фото/черновиком }
                delivery:
                  type: object
                  properties:
                    method: { type: string, enum: [pickup, cdek, yandex, belpost] }
                    address: { type: string }
                promoCode: { type: string }
      responses:
        "201":
          description: Создан (повтор с тем же ключом — тот же заказ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Заказ (клиент видит только свой)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Problem" }
  /orders/{id}/timeline:
    get:
      tags: [Orders]
      summary: Статусная лента заказа (для экрана отслеживания)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderEvent" }

  # ---------------- Assistant (трек 3) ----------------
  /assistant/chat:
    post:
      tags: [Assistant]
      summary: |
        Сообщение ассистенту «Проявитель». Ответ стримится как SSE (text/event-stream),
        каждая дельта — {delta: "..."}, источники и proposals приходят отдельными событиями.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "Подготовь встречу по росту брака" }
                contextScreen: { type: string, description: экран, с которого вызван ассистент }
      responses:
        "200":
          description: SSE-поток
          content:
            text/event-stream:
              schema: { type: string }
  /assistant/proposals:
    get:
      tags: [Assistant]
      summary: Ожидающие подтверждения действия (с предпросмотром)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proposal" }
  /assistant/proposals/{id}/confirm:
    post:
      tags: [Assistant]
      summary: Подтвердить действие (выполняется только после этого, AI-03)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Выполнено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
  /assistant/proposals/{id}/reject:
    post:
      tags: [Assistant]
      summary: Отклонить (системы остаются без изменений)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /assistant/morning-briefing:
    get:
      tags: [Assistant]
      summary: Утренний брифинг (сводка KPI, красные сигналы, дедлайны решений)
      responses:
        "200": { description: OK }
  /assistant/audit:
    get:
      tags: [Assistant]
      summary: Аудит ассистента: запрос, источники, предложение, подтверждение, результат
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Ошибка (RFC 7807)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              traceId: { type: string }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        departmentScope: { type: array, items: { type: string }, description: "id подразделений или [\"*\"]" }
        permissions: { type: array, items: { type: string } }
    Role:
      type: string
      enum: [director, department_head, analyst, hr, marketing, support_operator, moderator, production_worker, employee, client]
    TrafficLight:
      type: string
      enum: [green, yellow, red]
    Channel:
      type: string
      enum: [telegram, email, web_chat, mobile_app, site]
    SupportTopic:
      type: string
      enum: [defect, client_error, sample_question, delivery_question, other]
      description: брак / ошибка клиента / вопросы по образцу / вопросы по доставке
    OrderStatus:
      type: string
      enum: [accepted, moderation, printing, post_processing, assembly, ready, in_delivery, completed, cancelled, rejected]
    DecisionStatus:
      type: string
      enum: [new, in_progress, done, verified, failed]
    RejectReason:
      type: string
      enum: [low_resolution, empty_areas, unsupported_format, content_policy, other]
    TaskSource:
      type: string
      enum: [user, decision, meeting, assistant]
    BreakdownDimension:
      type: string
      enum: [day, week, department, product, channel, station, shift, campaign, cause]
    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        segment: { type: string, enum: [new, active, repeat, churn_risk, churned] }
        channel: { $ref: "#/components/schemas/Channel" }
        firstOrderAtUtc: { type: string, format: date-time }
        ltv: { type: number }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Фотокнига 20×20, 20 разворотов }
        category: { type: string, example: photobook }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              priceByn: { type: number }
              photoRequirements:
                type: object
                properties:
                  minPixels: { type: integer, example: 1500000 }
                  formats: { type: array, items: { type: string }, example: [JPEG, PNG] }
                  maxFileMb: { type: integer }
        productionDays: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        productId: { type: string }
        amountByn: { type: number }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        createdAtUtc: { type: string, format: date-time }
        dueAtUtc: { type: string, format: date-time }
        deliveredOnTime: { type: boolean, nullable: true }
    OrderEvent:
      type: object
      properties:
        orderId: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        atUtc: { type: string, format: date-time }
        stationId: { type: string, nullable: true }
        actor: { type: string, description: "user id | assistant | system" }
    Defect:
      type: object
      properties:
        orderId: { type: string }
        stationId: { type: string, example: st-03 }
        shift: { type: string, example: "2026-11-05/день" }
        cause: { type: string, enum: [equipment, material, human, client_files, unknown] }
        detectedBy: { type: string, enum: [auto_qc, human] }
        costByn: { type: number }
    Interaction:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        topic: { $ref: "#/components/schemas/SupportTopic" }
        createdAtUtc: { type: string, format: date-time }
        firstReplyAtUtc: { type: string, format: date-time, nullable: true }
        resolvedAtUtc: { type: string, format: date-time, nullable: true }
        slaMinutes: { type: integer }
        inSla: { type: boolean, nullable: true }
        orderId: { type: string, nullable: true }
    MetricDefinition:
      type: object
      properties:
        code: { type: string, example: defect_rate }
        title: { type: string, example: Уровень брака }
        formula: { type: string, example: "defect_orders / total_orders × 100%" }
        source: { type: string, example: "Production/QC-вердикты" }
        refreshInterval: { type: string, example: "15 мин" }
        owner: { type: string, example: "Рук. производства" }
        unit: { type: string, example: "%" }
    KpiStatus:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        fact: { type: number }
        plan: { type: number, nullable: true }
        forecast: { type: number, nullable: true }
        unit: { type: string }
        status: { $ref: "#/components/schemas/TrafficLight" }
        definition: { $ref: "#/components/schemas/MetricDefinition" }
    Alert:
      type: object
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        kpiCode: { type: string }
        message: { type: string }
        drillTo: { type: string }
    ForecastPoint:
      type: object
      properties:
        weekStart: { type: string, format: date }
        demandOrders: { type: number }
        demandHours: { type: number }
        capacityHours: { type: number }
        deficitHours: { type: number, description: ">0 — дефицит мощности" }
        confidence: { type: string, enum: [low, medium, high] }
    DecisionCreate:
      type: object
      required: [problem, action, ownerId, deadline]
      properties:
        title: { type: string }
        problem: { type: string }
        impact: { type: string }
        cause: { type: string }
        action: { type: string }
        ownerId: { type: string }
        deadline: { type: string, format: date }
        priority: { type: integer, minimum: 1, maximum: 5 }
        kpiCode: { type: string }
        refEntity: { type: string, description: "order:…, station:st-03, campaign:…" }
    DecisionUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/DecisionStatus" }
        action: { type: string }
        ownerId: { type: string }
        deadline: { type: string, format: date }
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionCreate"
        - type: object
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/DecisionStatus" }
            createdFromAlertId: { type: string, nullable: true }
            verifyBefore: { type: number, nullable: true }
            verifyAfter: { type: number, nullable: true }
            createdAtUtc: { type: string, format: date-time }
    DecisionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        total: { type: integer }
    DecisionVerifyResult:
      type: object
      properties:
        decisionId: { type: string }
        outcome: { type: string, enum: [verified, failed, insufficient_data] }
        before: { type: number }
        after: { type: number }
        note: { type: string }
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        ownerId: { type: string }
        deadline: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, in_progress, done, cancelled] }
        source: { $ref: "#/components/schemas/TaskSource" }
        sourceRef: { type: string, description: "decision:…, meeting:…" }
    Document:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        aclLevel: { type: string, enum: [public, department, management, finance] }
        version: { type: integer }
        updatedAtUtc: { type: string, format: date-time }
    Station:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Станок №3 (термопереплёт) }
        state: { type: string, enum: [ok, degraded, maintenance, down] }
        loadPercent: { type: number }
        defectRate: { type: number }
        nextMaintenanceUtc: { type: string, format: date-time, nullable: true }
    Proposal:
      type: object
      properties:
        id: { type: string }
        tool: { type: string, example: createMeeting }
        summary: { type: string }
        preview:
          type: object
          description: Человекочитаемый предпросмотр действия (AI-03)
        status: { type: string, enum: [pending, confirmed, rejected, executed, failed] }
        createdAtUtc: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        atUtc: { type: string, format: date-time }
        actorId: { type: string }
        actorType: { type: string, enum: [user, assistant, system] }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        result: { type: string, enum: [success, denied, error] }
        detail: { type: string }
