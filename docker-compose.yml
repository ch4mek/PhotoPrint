version: "3.9"

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kontur}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kontur}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-kontur}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-kontur};User=root;Password=${MYSQL_ROOT_PASSWORD:-kontur}
      Jwt__Secret: ${JWT_SECRET:-change-me-in-env}
      Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-120}
      UseMocks: ${USE_MOCKS:-true}
      Llm__Provider: ${LLM_PROVIDER:-mock}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-}
      TZ: Europe/Minsk
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  mysqldata:
