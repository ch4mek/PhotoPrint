app: "mms-fe"
env: "dev"

deployment:
  image: ""
  tag: ""
  replicas: 1
  imagePullPolicy: Always
  imagePullSecrets: "gitlab-pull-secret"
  containerPort:
    http: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  probes:
    startupProbe:
      httpGet:
        path: /health/live
        port: 80
      failureThreshold: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 30  
    livenessProbe:
      httpGet:
        path: /health/live
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10

service:
  type: ClusterIP
  servicePort:
    http: 80

ingress:
  ingressDomain: ""
  secretName: ""


autoscaling:
  replicas:
    min: 1
    max: 1
  cpuAverageUtilization: 70
  memoryAverageUtilization: 80
