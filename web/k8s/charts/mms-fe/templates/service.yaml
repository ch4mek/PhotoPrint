apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "this.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "this.selectorLabels" . | nindent 4 }}
  ports:
    - name: app-http-listener
      protocol: TCP
      port: {{ .Values.service.servicePort.http }}
      targetPort: {{ .Values.deployment.containerPort.http }}
  type: {{ .Values.service.type }}
