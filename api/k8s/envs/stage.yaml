app_env: "staging"
infrastructure_env: "development"

apps:
  portalapi:
    installed: true
    deployment:
      tag: ""
      resources:
        requests:
          memory: "512Mi"
          cpu: "150m"
        limits:
          memory: "800Mi"
          cpu: "750m"
    ingress:
      ingressDomain: "mms-api.staging.modsen.app"
      secretName: "mms-api-staging-modsen-app"
    routes:
      - name: mms-api-staging-httproute 
        enabled: true        
        namespace: development-mms-staging
        serviceName: development-mms-staging-svc
        gateway: onprem-gateway
        gatewayNamespace: envoy-gateway-system
        sectionName: https-mms-api-staging
        hostnames:
          - mms-api.staging.modsen.app
        rules:
          - name: rule-0-prefix-root
            matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: development-mms-staging-svc
                port: 8082
                group: ''
                kind: Service
                weight: 1
        backendTrafficPolicy:
          enabled: true
          name: mms-api-staging
          namespace: development-mms-staging
          timeout:
            tcp:
              connectTimeout: 15s
            http:
              requestTimeout: 3600s
          loadBalancer:
            type: ConsistentHash
            consistentHash:
              type: Cookie
              cookie:
                name: stickounet
                ttl: 7200s
      - name: mms-api-swagger-staging-httproute
        enabled: true        
        namespace: development-mms-staging
        serviceName: development-mms-staging-svc
        gateway: onprem-gateway
        gatewayNamespace: envoy-gateway-system
        sectionName: https-mms-api-staging
        hostnames:
          - mms-api.staging.modsen.app
        rules:
          - name: rule-0-prefix-swagger
            matches:
              - path:
                  type: PathPrefix
                  value: /swagger
            backendRefs:
              - name: development-mms-staging-svc
                port: 8082
                group: ''
                kind: Service
                weight: 1
        backendTrafficPolicy:
          enabled: true
          name: mms-api-swagger-staging
          namespace: development-mms-staging
          timeout:
            tcp:
              connectTimeout: 15s
            http:
              requestTimeout: 3600s
          loadBalancer:
            type: ConsistentHash
            consistentHash:
              type: Cookie
              cookie:
                name: stickounet
                ttl: 7200s
        securityPolicy:
          enabled: true
          name: mms-api-swagger-staging
          namespace: development-mms-staging
          authorization:
            defaultAction: Deny
            rules:
            - action: Allow
              principal:
                clientCIDRs:
                - 172.18.0.1/32
                - 172.30.0.1/32
                - 172.30.11.106/32
                - 172.30.11.160/24
                - 172.30.4.232/22
                - 178.124.193.89/32
                - 178.124.220.229/32
                - 193.42.36.50/32
                - 217.21.54.219/32
                - 38.180.110.213/32
                - 38.180.217.175/32
                - 38.180.217.58/32
                - 38.180.68.88/32
                - 5.45.83.84/32
                - 5.61.37.218/32
                - 77.83.196.78/32
                - 77.83.196.85/32
                - 85.158.109.149/32
                - 91.149.184.73/32
                - 91.239.148.9/32
                - 94.75.64.40/32
      - name: rabbitmq-staging-httproute
        enabled: true        
        namespace: development-mms-staging
        serviceName: development-mms-rabbitmq
        gateway: onprem-gateway
        gatewayNamespace: envoy-gateway-system
        sectionName: rabbitmq-staging
        hostnames:
          - rabbitmq.staging.modsen.app
        rules:
          - name: rule-0-prefix-root
            matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: development-mms-rabbitmq
                port: 15672
                group: ''
                kind: Service
                weight: 1
  redis:
    installed: true
    auth:
      enabled: false
    replicaCount: 0
    nodeAffinityPreset:
      type: "hard"
      key: node-group
      values:
        - development
    resources:
      requests:
        cpu: "50m"
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: 128Mi
  postgresql:
    installed: false
  rabbitmq:
    installed: true
    ingress:
      enabled: true
      hostname: rabbitmq.staging.modsen.app
      tls: true
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: "letsencrypt"
    persistence:
      size: 8Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "300m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    replicaCount: 1
    nodeAffinityPreset:
      type: hard
      key: node-group
      values:
        - development
    loadDefinition:
      enabled: true
      existingSecret: rabbitmq-staging-load-definition
      existingSecretKey: load_definition.json
  postgresqlBackupDev:
    installed: true
    secret:
      secretName: "development-mms-staging-secrets"
      trackDBKey: "API_ConnectionStrings__TrackDb"
    ceph:
      bucketName: postgresql-backup-dev-bucket-claim
      namespace: development-mms-staging
      storageClassName: ceph-bucket
      path: "postgres/"
  postgresqlBackupDevRecruitment:
    installed: true
    secret:
      secretName: "development-mms-recruitment-staging-secrets"
      hostKey: "DB_HOST"
      portKey: "DB_PORT"
      databaseKey: "DB_NAME"
      usernameKey: "DB_USER"
      passwordKey: "DB_PASSWORD"
      schemaKey: "DB_SCHEMA"
    ceph:
      bucketName: postgresql-backup-dev-recruitment-bucket-claim
      namespace: development-mms-staging
      storageClassName: ceph-bucket
      path: "postgres/"
