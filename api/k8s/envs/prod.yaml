app_env: "prod"
infrastructure_env: "production"

apps:
  portalapi:
    installed: true
    deployment:
      tag: ""
      resources:
        requests:
          memory: "512Mi"
          cpu: "150m"
        limits:
          memory: "1024Mi"
          cpu: "750m"
    ingress:
      ingressDomain: "mms-api.production.modsen.app"
      secretName: "mms-api-production-modsen-app"
  redis:
    installed: true
    auth:
      enabled: false
    replicaCount: 0
    nodeAffinityPreset:
      type: "hard"
      key: "node-group"
      values:
        - "production"
    resources:
      requests:
        cpu: "50m"
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: 128Mi
  postgresql:
    installed: false
  rabbitmq:
    installed: true
    ingress:
      enabled: true
      hostname: rabbitmq.production.modsen.app
      tls: true
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: "letsencrypt"
        nginx.ingress.kubernetes.io/whitelist-source-range: "193.42.36.50/32,217.21.54.219/32,178.124.193.89/32,91.149.184.73/32,178.124.220.229/32,77.83.196.85/32"
    persistence:
      size: 8Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "300m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    replicaCount: 1
    nodeAffinityPreset:
      type: hard
      key: node-group
      values:
        - production
    loadDefinition:
      enabled: true
      existingSecret: rabbitmq-prod-load-definition
      existingSecretKey: load_definition.json
  postgresqlBackupDev:
    installed: false
  postgresqlBackupDevRecruitment:
    installed: false
