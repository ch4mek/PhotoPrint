app: "mms"
env: "dev"

deployment:
  image: ""
  tag: ""
  replicas: 1
  imagePullPolicy: IfNotPresent
  imagePullSecrets: "gitlab-pull-secret"
  containerPort:
    http: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  probe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 30
    
autoscaling:
  replicas:
    min: 1
    max: 1
  cpuAverageUtilization: 70
  memoryAverageUtilization: 80

service:
  type: ClusterIP
  servicePort:
    http: 8082

ingress:
  ingressDomain: ""
  secretName: ""
  