apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "this.fullname" . }}-script
  labels:
    {{- include "this.labels" . | nindent 4 }}
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
    BACKUP_FILE="/tmp/postgresql_backup_${TIMESTAMP}.sql.gz"
    S3_PREFIX="${S3_PREFIX#/}"
    S3_PREFIX="${S3_PREFIX%/}"
    BACKUP_PREFIX="postgresql_backup_${DEVELOPMENT_ENV}_"
    BACKUP_KEY="${S3_PREFIX:+${S3_PREFIX}/}${BACKUP_PREFIX}${TIMESTAMP}.sql.gz"
    BACKUP_URI="s3://${S3_BUCKET}/${BACKUP_KEY}"
    RETENTION_VALUE=$((RETENTION_COUNT + 1))

    echo "=== Starting PostgreSQL Backup ==="

    echo "Installing dependencies..."
    if ! command -v aws &>/dev/null; then
      if command -v apk &>/dev/null; then
        apk add --no-cache aws-cli
      elif command -v apt-get &>/dev/null; then
        apt-get update -qq && apt-get install -y --no-install-recommends awscli
      else
        echo "ERROR: No supported package manager found (apk/apt-get)"
        exit 1
      fi
      echo "Dependencies installed successfully"
    else
      echo "Dependencies already available, skipping install"
    fi

    echo "Configuring AWS CLI for Ceph RGW..."
    ENDPOINT_URL="http://${S3_ENDPOINT}:${S3_BUCKET_PORT}"

    aws configure set aws_access_key_id "${S3_ACCESS_KEY}"
    aws configure set aws_secret_access_key "${S3_SECRET_KEY}"
    aws configure set default.region "us-east-1"
    aws configure set default.s3.signature_version "s3v4"

    echo "Testing AWS CLI connection to Ceph RGW..."
    if ! aws --endpoint-url="${ENDPOINT_URL}" s3 ls "s3://${S3_BUCKET}" 2>&1; then
      echo "ERROR: AWS CLI authentication failed"
      echo "Endpoint: ${S3_ENDPOINT}"
      echo "Bucket: ${S3_BUCKET}"
      exit 1
    fi
    echo "Connected to Ceph successfully"


    echo "Testing PostgreSQL connection..."
    echo "Parse secrets..."
    IFS=';' read -ra PARTS <<< "$TRACK_DB"

    for item in "${PARTS[@]}"; do
        key="${item%%=*}"     # left side
        value="${item#*=}"    # right side

        norm_key=$(echo "$key" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
        case "$norm_key" in
            HOST)
                POSTGRES_HOST="$value"
                ;;
            PORT)
                POSTGRES_PORT="$value"
                ;;
            DATABASE)
                POSTGRES_DB="$value"
                ;;
            USERID)
                POSTGRES_USER="$value"
                ;;
            PASSWORD)
                POSTGRES_PASSWORD="$value"
                ;;
        esac
    done


    export PGPASSWORD="${POSTGRES_PASSWORD}"

    if ! pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -t 10; then
      echo "ERROR: Cannot connect to PostgreSQL at ${POSTGRES_HOST}:${POSTGRES_PORT}"
      exit 1
    fi
    echo "PostgreSQL connection successful"

    PG_DUMP_SCHEMA_ARGS=()
    IFS=',' read -ra EXCLUDED_SCHEMAS <<< "${POSTGRES_EXCLUDE_SCHEMAS}"
    for schema in "${EXCLUDED_SCHEMAS[@]}"; do
      if [ -n "${schema}" ]; then
        PG_DUMP_SCHEMA_ARGS+=(--exclude-schema="${schema}")
      fi
    done

    echo "Running pg_dump..."
    if ! pg_dump \
      -h "${POSTGRES_HOST}" \
      -p "${POSTGRES_PORT}" \
      -U "${POSTGRES_USER}" \
      -d "${POSTGRES_DB}" \
      "${PG_DUMP_SCHEMA_ARGS[@]}" \
      --no-owner \
      --no-acl \
      --clean \
      --if-exists \
      | gzip > "${BACKUP_FILE}"; then
      echo "ERROR: pg_dump failed!"
      exit 1
    fi

    echo "Backup created successfully"

    echo "Uploading to Ceph via aws-cli..."

    if aws --endpoint-url="${ENDPOINT_URL}" s3 cp "${BACKUP_FILE}" "${BACKUP_URI}"; then
      echo "Backup uploaded successfully to ${BACKUP_URI}"

      echo "Applying retention policy (keeping the ${RETENTION_COUNT} most recent backups)..."

      aws --endpoint-url="${ENDPOINT_URL}" s3 ls "s3://${S3_BUCKET}/${S3_PREFIX:+${S3_PREFIX}/}" | awk -v prefix="${BACKUP_PREFIX}" '$4 ~ "^" prefix { print }' | sort -r | tail -n +${RETENTION_VALUE} | while read -r line; do
        FILE_TO_DELETE=$(echo "$line" | awk '{print $4}')
        if [ -n "$FILE_TO_DELETE" ]; then
          echo "Delete old backup: $FILE_TO_DELETE"
          aws --endpoint-url="${ENDPOINT_URL}" s3 rm "s3://${S3_BUCKET}/${S3_PREFIX:+${S3_PREFIX}/}${FILE_TO_DELETE}"
        fi
      done
    else
      echo "ERROR: Failed to upload backup to Ceph!"
      rm -f "${BACKUP_FILE}"
      exit 1
    fi

    rm -f "${BACKUP_FILE}"

    echo "========================================"
    echo "BACKUP COMPLETED SUCCESSFULLY"
    echo "========================================"
