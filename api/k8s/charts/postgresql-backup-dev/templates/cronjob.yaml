apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "this.name" . }}
spec:
  schedule: {{ .Values.postgresqlBackupDev.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.postgresqlBackupDev.job.backoffLimit | default 0 }}
      ttlSecondsAfterFinished: {{ .Values.postgresqlBackupDev.ttlSecondsAfterFinished | default 1800 }}
      activeDeadlineSeconds: {{ .Values.postgresqlBackupDev.job.activeDeadlineSeconds | default 2700 }}
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: "{{ .Values.postgresqlBackupDev.image.repository }}:{{ .Values.postgresqlBackupDev.image.tag }}"
            imagePullPolicy: {{ .Values.postgresqlBackupDev.image.pullPolicy }}
            command: ["/bin/bash", "/scripts/backup.sh"]
            volumeMounts:
            - name: backup-script
              mountPath: /scripts
            env:
            - name: TRACK_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresqlBackupDev.secret.secretName }}
                  key: {{ .Values.postgresqlBackupDev.secret.trackDBKey }}
            - name: DEVELOPMENT_ENV
              value: {{ .Values.app_env | quote }}
            - name: RETENTION_COUNT
              value: {{ .Values.postgresqlBackupDev.backup.retention | quote }}
            - name: POSTGRES_EXCLUDE_SCHEMAS
              value: {{ join "," .Values.postgresqlBackupDev.backup.excludeSchemas | quote }}
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.postgresqlBackupDev.ceph.bucketName }}
                  key: BUCKET_HOST
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.postgresqlBackupDev.ceph.bucketName }}
                  key: BUCKET_NAME
            - name: S3_BUCKET_PORT 
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.postgresqlBackupDev.ceph.bucketName }}
                  key: BUCKET_PORT
            - name: S3_PREFIX
              value: {{ .Values.postgresqlBackupDev.ceph.path | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresqlBackupDev.ceph.bucketName }}
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresqlBackupDev.ceph.bucketName }}
                  key: AWS_SECRET_ACCESS_KEY
            resources:
              {{- toYaml .Values.postgresqlBackupDev.pod.resources | nindent 14 }}

          volumes:
          - name: shared-tools
            emptyDir: {}

          - name: backup-script
            configMap:
              name: {{ include "this.fullname" . }}-script
              defaultMode: 0755
